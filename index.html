<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dept. of Mechanical Engineering — VNIT Nagpur</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* ═══════════════════════════════════════════════════════
   DESIGN TOKENS — edit these to change colors/fonts
   ═══════════════════════════════════════════════════════ */
:root {
  --bg:         #07090f;
  --surface:    #0f1319;
  --surface2:   #161c27;
  --surface3:   #1d2535;
  --border:     #252e42;
  --border2:    #1a2130;
  --fg:         #e8ecf6;
  --fg2:        #8c97b4;
  --fg3:        #4e5a76;
  --accent:     #1a56db;   /* VNIT blue */
  --accent2:    #f59e0b;   /* gold accent */
  --accent3:    #10b981;   /* green */
  --red:        #ef4444;
  --radius:     14px;
  --radius-sm:  8px;
  --gap:        14px;
  color-scheme: dark;
}

/* ═══════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; width: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════════════════════
   OUTER SHELL
   ═══════════════════════════════════════════════════════ */
.shell {
  display: grid;
  height: 100vh;
  grid-template-rows: 80px 1fr;
  gap: var(--gap);
  padding: 12px 14px 14px;
}

/* ═══════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════ */
.header {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 20px 0 16px;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: linear-gradient(180deg, var(--accent), var(--accent2));
}

.header-brand { display: flex; align-items: center; gap: 12px; }
.brand-emblem {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--accent), #0e3fa6);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  box-shadow: 0 2px 12px rgba(26,86,219,0.4);
}
.brand-text { min-width: 0; }
.brand-name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px; font-weight: 700;
  color: var(--fg); line-height: 1.2;
  letter-spacing: -0.01em;
}
.brand-sub { font-size: 11px; color: var(--fg2); letter-spacing: 0.03em; }

.header-ticker {
  min-width: 0;
  overflow: hidden;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 0 16px;
  height: 100%;
  display: flex; align-items: center;
}
.ticker-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--accent2);
  flex-shrink: 0; margin-right: 10px;
  background: rgba(245,158,11,0.1);
  padding: 3px 8px; border-radius: 4px;
}
.ticker-track { overflow: hidden; flex: 1; }
.ticker-inner {
  display: inline-block; white-space: nowrap;
  font-size: 12px; color: var(--fg2);
  animation: scroll-ticker 40s linear infinite;
}
@keyframes scroll-ticker {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.header-clock { text-align: right; flex-shrink: 0; }
.clock-time {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 32px; font-weight: 700;
  letter-spacing: -0.04em; line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--fg);
}
.clock-date { font-size: 11px; color: var(--fg2); margin-top: 2px; }

/* ═══════════════════════════════════════════════════════
   MAIN GRID
   ═══════════════════════════════════════════════════════ */
.main {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: var(--gap);
  min-height: 0;
}

/* ═══════════════════════════════════════════════════════
   CARD BASE
   ═══════════════════════════════════════════════════════ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex; flex-direction: column;
  overflow: hidden; min-height: 0;
}
.card-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.card-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--fg3);
  display: flex; align-items: center; gap: 7px;
}
.card-title .dot {
  width: 6px; height: 6px; border-radius: 50%;
  animation: blink 2.5s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
.dot-blue   { background: var(--accent); }
.dot-gold   { background: var(--accent2); }
.dot-green  { background: var(--accent3); }
.dot-red    { background: var(--red); }
.card-count {
  font-size: 10px; color: var(--fg3);
  background: var(--surface2); padding: 2px 8px;
  border-radius: 20px; border: 1px solid var(--border);
}
.card-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.scroll-area { flex: 1; overflow-y: auto; scrollbar-width: none; }
.scroll-area::-webkit-scrollbar { display: none; }

/* ═══════════════════════════════════════════════════════
   FACULTY CAROUSEL — spans both rows, left column
   ═══════════════════════════════════════════════════════ */
.faculty-card { grid-row: 1 / 3; }
.faculty-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border2);
  flex: 1;
  overflow: hidden;
}
.faculty-item {
  background: var(--surface);
  padding: 14px 14px 12px;
  display: flex; flex-direction: column;
  align-items: center; gap: 8px;
  text-align: center;
  transition: background 0.2s;
  cursor: default;
  position: relative;
  overflow: hidden;
}
.faculty-item::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
  transform: scaleX(0); transition: transform 0.3s;
}
.faculty-item:hover { background: var(--surface2); }
.faculty-item:hover::after { transform: scaleX(1); }

.faculty-avatar {
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--surface3);
  border: 2px solid var(--border);
  overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  color: var(--accent);
  object-fit: cover;
}
.faculty-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

.faculty-name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12.5px; font-weight: 700;
  color: var(--fg); line-height: 1.2;
  text-wrap: balance;
}
.faculty-desig {
  font-size: 10.5px; color: var(--accent2);
  font-weight: 500; line-height: 1.2;
}
.faculty-area {
  font-size: 10px; color: var(--fg2);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.faculty-tags {
  display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;
}
.faculty-tag {
  font-size: 9px; color: var(--accent);
  background: rgba(26,86,219,0.12);
  padding: 2px 6px; border-radius: 10px;
  border: 1px solid rgba(26,86,219,0.2);
  line-height: 1.4;
}

/* pagination dots */
.faculty-pager {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 8px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.pager-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--border); cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}
.pager-dot.active { background: var(--accent); transform: scale(1.3); }

/* ═══════════════════════════════════════════════════════
   MEETINGS CARD
   ═══════════════════════════════════════════════════════ */
.meeting-item {
  display: grid;
  grid-template-columns: 52px 3px 1fr;
  gap: 0 10px;
  padding: 11px 16px;
  align-items: start;
  border-bottom: 1px solid var(--border2);
}
.meeting-item:last-child { border-bottom: none; }
.meeting-time {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11.5px; font-weight: 700;
  color: var(--accent); font-variant-numeric: tabular-nums;
  padding-top: 1px;
}
.meeting-time.past { color: var(--fg3); }
.meeting-time.now  { color: var(--accent2); }
.meeting-bar { align-self: stretch; border-radius: 2px; background: var(--border); min-height: 32px; }
.meeting-bar.now  { background: var(--accent2); }
.meeting-bar.done { background: var(--fg3); opacity: 0.3; }
.meeting-info { min-width: 0; }
.meeting-title {
  font-size: 12.5px; font-weight: 600; color: var(--fg); line-height: 1.3;
}
.meeting-title.done { color: var(--fg3); text-decoration: line-through; }
.meeting-sub { font-size: 10.5px; color: var(--fg2); margin-top: 2px; }
.now-pill {
  display: inline-block; font-size: 8.5px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent2); background: rgba(245,158,11,0.12);
  padding: 2px 6px; border-radius: 10px; margin-left: 6px;
  vertical-align: middle;
}

/* ═══════════════════════════════════════════════════════
   ANNOUNCEMENTS CARD
   ═══════════════════════════════════════════════════════ */
.announce-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border2);
  display: flex; gap: 10px; align-items: flex-start;
}
.announce-item:last-child { border-bottom: none; }
.announce-icon {
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
}
.announce-icon.urgent { background: rgba(239,68,68,0.12); }
.announce-icon.info   { background: rgba(26,86,219,0.12); }
.announce-icon.notice { background: rgba(245,158,11,0.12); }
.announce-content { min-width: 0; }
.announce-title {
  font-size: 12.5px; font-weight: 600; color: var(--fg); line-height: 1.3;
}
.announce-body { font-size: 11px; color: var(--fg2); margin-top: 3px; line-height: 1.5; }
.announce-meta {
  display: flex; gap: 8px; align-items: center; margin-top: 5px;
}
.announce-tag {
  font-size: 9.5px; padding: 2px 7px; border-radius: 10px;
  font-weight: 600; letter-spacing: 0.03em;
}
.tag-urgent { color: var(--red); background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); }
.tag-info   { color: var(--accent); background: rgba(26,86,219,0.1); border: 1px solid rgba(26,86,219,0.2); }
.tag-notice { color: var(--accent2); background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.2); }
.announce-date { font-size: 10px; color: var(--fg3); }

/* ═══════════════════════════════════════════════════════
   ACHIEVEMENTS CARD
   ═══════════════════════════════════════════════════════ */
.achieve-item {
  padding: 11px 16px;
  border-bottom: 1px solid var(--border2);
  display: flex; gap: 10px; align-items: flex-start;
}
.achieve-item:last-child { border-bottom: none; }
.achieve-badge {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
  background: var(--surface3);
  border: 1px solid var(--border);
}
.achieve-info { min-width: 0; }
.achieve-name {
  font-size: 12.5px; font-weight: 600; color: var(--fg); line-height: 1.3;
}
.achieve-desc { font-size: 11px; color: var(--fg2); margin-top: 2px; line-height: 1.4; }
.achieve-who { font-size: 10px; color: var(--accent2); margin-top: 4px; font-weight: 500; }

/* ═══════════════════════════════════════════════════════
   GUEST LECTURE CARD  (bottom-right)
   ═══════════════════════════════════════════════════════ */
.guest-featured {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(26,86,219,0.08), rgba(245,158,11,0.05));
}
.guest-eyebrow {
  font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--accent2); font-weight: 700; margin-bottom: 6px;
}
.guest-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px; font-weight: 700;
  color: var(--fg); line-height: 1.35;
  text-wrap: balance;
}
.guest-speaker {
  font-size: 11.5px; color: var(--accent); margin-top: 5px; font-weight: 500;
}
.guest-when {
  font-size: 10.5px; color: var(--fg2); margin-top: 3px;
}
.guest-venue {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; color: var(--fg3);
  background: var(--surface2); padding: 3px 8px;
  border-radius: 10px; margin-top: 6px;
  border: 1px solid var(--border);
}

.guest-upcoming { flex: 1; overflow-y: auto; scrollbar-width: none; }
.guest-upcoming::-webkit-scrollbar { display: none; }
.guest-row {
  padding: 9px 16px;
  border-bottom: 1px solid var(--border2);
  display: flex; gap: 10px; align-items: center;
}
.guest-row:last-child { border-bottom: none; }
.guest-row-date {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px; font-weight: 700; color: var(--accent2);
  font-variant-numeric: tabular-nums;
  min-width: 36px; text-align: center;
  background: rgba(245,158,11,0.08);
  padding: 4px 4px; border-radius: 6px;
  line-height: 1.2;
}
.guest-row-info { min-width: 0; }
.guest-row-title { font-size: 12px; font-weight: 600; color: var(--fg); line-height: 1.3; }
.guest-row-speaker { font-size: 10.5px; color: var(--fg2); }
</style>
</head>

</div>

/* ══════════════════════════════════════════════════════════════

function updateClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clockTime').textContent = `${hh}:${mm}:${ss}`;
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('clockDate').textContent =
    `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
  const dnames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('meetDay').textContent = dnames[now.getDay()];
}
setInterval(updateClock, 1000);

/* ══════════════════════════════════════════════════════════════
   FACULTY CAROUSEL (auto-pages every 8s, 2×3 grid = 6 per page)
   ══════════════════════════════════════════════════════════════ */
const PER_PAGE = 6;
let currentPage = 0;
let facultyTimer;

function renderFaculty(page) {
  const grid = document.getElementById('facultyGrid');
  const pager = document.getElementById('facultyPager');
  const total = Math.ceil(FACULTY.length / PER_PAGE);
  const slice = FACULTY.slice(page * PER_PAGE, (page + 1) * PER_PAGE);

  document.getElementById('facultyCount').textContent = `${FACULTY.length} Faculty`;

  grid.innerHTML = slice.map(f => {
    const initials = f.name.replace('Prof.','').replace('Dr.','').trim().split(' ')
      .filter(Boolean).map(w => w[0]).slice(0,2).join('');
    const avatarHtml = f.image
      ? `<img src="${escHtml(f.image)}" alt="${escHtml(f.name)}" onerror="this.parentElement.textContent='${escHtml(initials)}'">`
      : escHtml(initials);
    return `<div class="faculty-item">
      <div class="faculty-avatar">${avatarHtml}</div>
      <div class="faculty-name">${escHtml(f.name)}</div>
      <div class="faculty-desig">${escHtml(f.desig)}</div>
      <div class="faculty-area">${escHtml(f.area)}</div>
      <div class="faculty-tags">${f.tags.map(t => `<span class="faculty-tag">${escHtml(t)}</span>`).join('')}</div>
    </div>`;
  }).join('');

  // pager dots
  pager.innerHTML = Array.from({length: total}, (_,i) =>
    `<div class="pager-dot ${i===page?'active':''}" onclick="goPage(${i})"></div>`
  ).join('');
}

function goPage(p) {
  clearInterval(facultyTimer);
  currentPage = p;
  renderFaculty(currentPage);
  startFacultyTimer();
}

function startFacultyTimer() {
  facultyTimer = setInterval(() => {
    const total = Math.ceil(FACULTY.length / PER_PAGE);
    currentPage = (currentPage + 1) % total;
    renderFaculty(currentPage);
  }, 8000);
}

renderFaculty(0);
startFacultyTimer();

/* ══════════════════════════════════════════════════════════════
   MEETINGS
   ══════════════════════════════════════════════════════════════ */
function renderMeetings() {
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  document.getElementById('meetingList').innerHTML = MEETINGS.map(m => {
    const [h, mi] = m.time.split(':').map(Number);
    const start = h * 60 + mi, end = start + m.dur;
    const isNow = nowMins >= start && nowMins < end;
    const isPast = nowMins >= end;
    return `<div class="meeting-item">
      <div class="meeting-time ${isNow?'now':isPast?'past':''}">${escHtml(m.time)}</div>
      <div class="meeting-bar ${isNow?'now':isPast?'done':''}"></div>
      <div class="meeting-info">
        <div class="meeting-title ${isPast?'done':''}">${escHtml(m.title)}${isNow?'<span class="now-pill">NOW</span>':''}</div>
        <div class="meeting-sub">${escHtml(m.sub)}</div>
      </div>
    </div>`;
  }).join('');
}
renderMeetings();
setInterval(renderMeetings, 60000);

/* ══════════════════════════════════════════════════════════════
   UTILITY
   ══════════════════════════════════════════════════════════════ */
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
